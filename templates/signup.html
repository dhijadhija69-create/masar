{% extends "auth_base.html" %}
{% block title %}Créer un compte · Masar{% endblock %}
{% block content %}
<p class="auth-eyebrow">Votre parcours commence ici</p>
<h1>Créer votre compte Masar.</h1>
<p class="muted">Retrouvez vos opportunités au même endroit.</p>
{% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="form" autocomplete="on">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Nom complet<input name="nom" value="{{ form.nom }}" autocomplete="name" placeholder="Votre nom" required maxlength="80" autofocus></label>
  <label>Adresse e-mail<input type="email" name="email" value="{{ form.email }}" autocomplete="email" placeholder="nom@exemple.com" required maxlength="120"></label>
  <label>Mot de passe <small>8 caractères minimum, pas uniquement des chiffres</small>
    <input type="password" name="password" autocomplete="new-password" required minlength="8"></label>
  <label>Confirmer le mot de passe<input type="password" name="password2" autocomplete="new-password" required minlength="8"></label>
  <button class="btn wide">Créer mon compte <span aria-hidden="true">→</span></button>
</form>
<p class="auth-switch">Déjà inscrit ? <a href="{{ url_for('login') }}">Se connecter</a></p>
{% endblock %}
